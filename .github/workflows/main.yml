name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Check for changes
      uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          src:
            - 'cmd/main.go'
            - 'internal/handler/**/handler.go'

    - name: Generate
      if: steps.changes.outputs.src == 'true'
      run: |
        docker run --rm -v $PWD:/code ghcr.io/swaggo/swag:v1.16.6 fmt  
        docker run --rm -v $PWD:/code ghcr.io/swaggo/swag:v1.16.6 init -d ./cmd/,./ -o ./docs

    - name: Commit generated
      if: steps.changes.outputs.src == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update swagger docs [skip ci]"
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"

  build:
    runs-on: ubuntu-latest
    needs: generate

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.5'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
