# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go generate & build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check for handler changes
      id: check-handlers
      run: |
        # Для push используем сравнение с предыдущим коммитом
        # Для pull_request используем сравнение с базовой веткой

        if [[ "${{ github.event_name }}" == "push" ]]; then
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        else
          # fallback: сравниваем с HEAD^ (последний коммит)
          BASE_SHA="HEAD^"
          HEAD_SHA="HEAD"
        fi

        # Получаем список изменённых файлов между BASE_SHA и HEAD_SHA,
        # фильтруем только те, что попадают под маску internal/handler/**/handler.go

        changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^internal/handler/[^/]+/handler\.go$' || true)

        if [[ -n "$changed_files" ]]; then
          echo "handler_changed=true" >> $GITHUB_OUTPUT
        else
          echo "handler_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.5'

    - name: Generate swagger docs
      if: steps.check-handlers.outputs.handler_changed == 'true'
      run: go generate ./...

    - name: Check for docs changes
      id: check-docs
      run: |
        if git status --porcelain | awk '{print $2}' | grep -q "^docs/"; then
          echo "docs_changed=true" >> $GITHUB_OUTPUT
        else
          echo "docs_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Commit generated docs
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update swagger docs [skip ci]"
        file_pattern: "docs/*"
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"
